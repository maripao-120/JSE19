        let cambiarForma = () => {    
            console.log("cambiando forma");    
            let div = document.createElement('div');
            div.style.border = "2px solid black";
            div.style.display = "flex";
            div.style.flexDirection = "column";
            div.style.alignItems = "center";
            div.style.gap = "30px";
            div.style.width = "600px";
            div.style.margin = "0 auto";
            div.style.padding = "50px";
            div.style.backgroundColor = "black";
            // getElementsByClassName devuelve un HTMLCollection, es decir, una colección de elementos HTML que tienen la clase especificada. Es similar a un array, pero no es exactamente un array. Puedes acceder a los elementos de la colección utilizando índices, como imgs[0], imgs[1], etc., pero no puedes usar métodos de array como forEach directamente en la colección. Sin embargo, puedes convertir la colección en un array utilizando Array.from() o el operador de propagación (...) para poder usar métodos de array.
            let imgs = document.querySelectorAll(".mortygroup");
            console.log(imgs);
            
            for (let i = 0; i < imgs.length; i++) {
                console.log(div);  
                const img = imgs[i]; 
                if(i % 2 == 0){
                    img.style.borderRadius = "50%";
                } else {
                    img.style.borderRadius = "0%";
                }
                div.appendChild(img);
             }
             document.body.appendChild(div);
        }
